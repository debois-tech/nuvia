<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Nuvia: sign in</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 22px; color: #111; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { color: #555; margin: 0 0 14px; line-height: 1.4; font-size: 13px; }
  label { display: block; font-size: 13px; color: #444; margin: 10px 0 4px; }
  input { font: inherit; padding: 8px 10px; width: 100%; box-sizing: border-box; border: 1px solid #bbb; border-radius: 8px; }
  button { font: inherit; margin-top: 16px; padding: 9px 18px; border: 0; border-radius: 999px; background: #111; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .err { color: #b3261e; margin-top: 10px; min-height: 1.3em; }
</style>
</head>
<body>
  <h1>Set up the Nuvia desktop agent</h1>
  <p>Sign in once to register this computer. Your password is not stored. While you are working, the agent reports when you use the mouse or keyboard. It never records what you type, which keys you press, or what is on screen.</p>
  <form id="f">
    <label for="server">Server address</label><input id="server" value="https://" required>
    <label for="org">Org ID</label><input id="org" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Register this computer</button>
    <div class="err" id="err" role="alert"></div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'); go.disabled = true;
    const err = await window.nuvia.enroll(server.value.trim(), org.value.trim(), pw.value);
    document.getElementById('err').textContent = err || '';
    go.disabled = false;
  });
</script>
</body>
</html>
