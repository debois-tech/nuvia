# Development database only. Production runs on the company Azure VM behind WireGuard.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuvia
      POSTGRES_PASSWORD: nuvia_dev
      POSTGRES_DB: nuvia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
